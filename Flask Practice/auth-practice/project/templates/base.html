<!DOCTYPE html>
<html>
    <head>
        <title>Auth Practice App</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">   
    <body class="has-navbar-fixed-top">
        <nav class="navbar is-fixed-top">
            <div class="navbar-brand">
                <span class="navbar-item">Authentication Practice</span>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                     <a class="navbar-item" href="{{url_for('index')}}"> Home </a> 
                     <!-- Note: Current_user comes from flask_login lib, allows access to logged-in user's information for display -->
                     {% if current_user.is_authenticated %}
                        <a class="navbar-item" href="{{url_for('exit')}}"> Logout </a>
                     {% else %}
                        <a class="navbar-item" href="{{url_for('login')}}"> Login </a>
                        <a class="navbar-item" href="{{url_for('sign_up')}}"> Register </a>
                     {% endif %}
                </div>
            </div>
        </nav>
        <section class="section">
            <div class="container">
                {%block content%}
                {%endblock%}
            </div>
        </section>
    </body>
</html>
